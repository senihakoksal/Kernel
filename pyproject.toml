[project]
name = "observation-kernel"
version = "0.1.0"
description = "A small multi-agent observation kernel: LLM artists coin artwork concepts, LLM critics evaluate them, and we study whether a coined aesthetic descriptor propagates across critics over rounds."
requires-python = ">=3.12"

# Runtime dependencies for the kernel itself (run.py).
dependencies = [
    "anthropic>=0.40",   # official SDK; we use AsyncAnthropic
    "pydantic>=2.0",     # structured + validated agent responses
    "python-dotenv>=1.0", # load ANTHROPIC_API_KEY from .env
    "pyyaml>=6.0",       # read agents.yaml
]

[project.optional-dependencies]
# Analysis-only dependencies (analyze.py). Kept separate so a bare run
# doesn't pull in the heavy NLP stack.
analysis = [
    "pandas>=2.0",
    "spacy>=3.7",                 # noun-phrase (descriptor) extraction
    "sentence-transformers>=3.0", # semantic similarity for propagation
    # The spaCy model is a dependency, not a post-install step. Installed by
    # hand it survives until the next `uv sync` rebuilds the venv and silently
    # drops it, and the regression tests then fail with OSError E050 for a
    # reason that has nothing to do with the change being tested.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "scikit-learn>=1.4",          # agglomerative descriptor clustering (metric= kwarg)
    "plotly>=5.0",                # visualization
]

# The Tier 2 judge (judge.py). A second provider on purpose: the agents are
# Sonnet, so a Claude judging them shares their priors — an out-of-family judge
# is the point, not a convenience. Optional, because nothing else needs it.
judge = [
    "openai>=1.0",
]

# Test-only dependencies. The suite stubs every client, so it needs no API key
# and makes no network calls.
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Flat scaffold: modules live at the repo root, so put it on the path for tests.
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.metadata]
# The spaCy model is pinned by URL (see the analysis extra); hatchling refuses
# direct references unless told they are intentional.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is a flat scaffold (scripts + modules at the repo root), not a package.
# Tell hatch there's nothing to package so `uv sync` doesn't error.
bypass-selection = true
