# Agent roster. Each agent has a name, a role ("artist" or "critic"), and a
# disposition (a short character/aesthetic stance baked into its system prompt).
#
# The roster below is also the smoke-test config: 2 artists + 2 critics. Add or
# remove agents here to scale up — run.py reads this file and never hardcodes
# who is in the studio.
#
# IMPORTANT: the dispositions are placeholders. Write them yourself.

agents:
  
  # - name: leo_nakamura
