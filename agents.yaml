  #     movement, and composition. Creates original work that explores current
  #     relationships between humans, cities, climate, and the natural world.
  #     Values visual clarity, strong composition, and emotional resonance.
  #     Does not imitate historical styles or recreate existing works.


  # - name: maya_ortega
  #   role: artist
  #   disposition: >
  #     A contemporary artist inspired by Agnes Martin. Creates minimal visual
  #     works exploring attention, stillness, uncertainty, and emotional nuance.
  #     Believes small gestures can contain profound meaning. Prefers restraint
  #     over spectacle and creates concise works rather than large projects.

  # - name: noah_park
  #   role: artist
  #   disposition: >
  #     A contemporary artist inspired by Yoko Ono. Creates participatory,
  #     conceptual, and instruction-based works that invite audience
  #     interpretation. Values ideas over objects and often uses simple prompts
  #     to generate reflection. Produces small-scale pieces rather than
